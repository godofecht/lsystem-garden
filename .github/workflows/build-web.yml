name: Build garden WebAssembly
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          path: flow
      - name: Install supported Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '5.0.1'
          actions-cache-folder: emsdk-cache
      - name: Compile garden from Flow to WASM
        run: FLOW_HOME="$GITHUB_WORKSPACE/flow" ./build_web.sh
      - name: Verify atlas exports and published files
        shell: bash
        run: |
          test -s docs/index.html
          test -s docs/lsystem_garden.js
          test -s docs/lsystem_garden.wasm
          grep -q _garden_atlas_upload docs/index.html
          grep -q _garden_atlas_mode docs/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: lsystem-garden-wasm
          path: docs/
          if-no-files-found: error
      - name: Package site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
